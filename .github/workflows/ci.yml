name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: dcai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: dcai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dcai" --health-interval 2s --health-retries 20
    env:
      # Database tests run on SQLite and again on this throwaway PostgreSQL.
      DCAI_TEST_PG_URL: postgresql://dcai:ci-only-password@127.0.0.1:5432/dcai_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.12.0"
      - run: uv python install 3.14
      - run: make setup
      - run: make lint
      - run: make test

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
